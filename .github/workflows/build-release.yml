name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.20.0

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build, selftest and package
        run: powershell -ExecutionPolicy Bypass -File build_tools/build.ps1

      # İsteğe bağlı kod imzalama:
      # Sertifika/bulut imzalama secrets'ları eklendikten sonra bu adımı açın.
      # - name: Sign artifacts
      #   run: |
      #     signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /a dist\QBTranslator\QBTranslator.exe
      #     signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /a installer\QBTranslator-Setup-*.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QBTranslator-build
          if-no-files-found: error
          path: |
            dist/QBTranslator/**
            installer/QBTranslator-Setup-*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: installer/QBTranslator-Setup-*.exe
