name: Build release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pyinstaller==6.20.0

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Test
        run: |
          python -m ruff check src tests
          python -m pytest -o addopts="" -q

      - name: Build packages
        run: powershell -ExecutionPolicy Bypass -File build_tools/build.ps1

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QBTranslator-release
          if-no-files-found: error
          path: |
            release/QBTranslator-Setup-*.exe
            release/QBTranslator-*-windows-x64.zip
            release/QBTranslator-Portable-*.exe
            release/SHA256SUMS.txt
