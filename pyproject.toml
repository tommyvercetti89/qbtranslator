[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qbtranslator"
version = "0.1.0"
description = "Modern Windows desktop translator built with PySide6"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "QBTranslator" }]
dependencies = [
    "PySide6>=6.10,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "ruff>=0.17,<0.18",
]

[project.gui-scripts]
qbtranslator = "qbtranslator.application:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qbtranslator = ["locales/*.json", "assets/*.ico", "assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"src/qbtranslator/core/ocr.py" = ["E501"]
